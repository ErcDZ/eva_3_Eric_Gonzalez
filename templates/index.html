<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body class="container mt-3">
        <header>
            <div class="alert alert-info text-center display-3" role="alert">
                TIENDA DE COMICS
            </div>
        </header>

        <main>

            {% if disponibilidad %}

                <div class="row justify-content-center align-items-top g-2 row-cols-4"> 
                    
                    {% for f in disponibilidad %}
                    
                        <div class="col">

                            <div class="card bg-dark text-white">
                                <img class="card-img-top" src="media/{{ f.portada }}" alt="Title" />
                                <div class="card-body d-flex flex-column">
                                    <h4 class="card-title">{{ f }}</h4>
                                    <p class="card-text">{{ f.fecha_lanzamiento }} </p>
                                    <p class="card-text">{{ f.precio }}

                                    </p>

                                    {% if f.stock == 0 %}

                                        <a name="" id="" class="btn btn-danger w-100 disabled" href="#" role="button">Agotado</a>

                                    {% else %}

                                        <button class="btn btn-success w-100">Reservar</button>

                                    {% endif %}

                                </div>

                            </div>

                        </div>

                    {% endfor %}

            {% else %}

                <div class="alert alert-warning text-center" role="alert">
                    No hay comics disponibles
                </div>

            {% endif %}

        </main>

        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
